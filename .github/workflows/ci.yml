# Lint, type-check, test (Node + OS matrix), Biome version compatibility and
# tarball contents. Also called by release.yml (`workflow_call`) so a release
# only ever happens from a commit that passed exactly these checks.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_call:

permissions:
  contents: read

concurrency:
  # `github.workflow` is the *caller's* name when this runs via workflow_call,
  # which keeps this group distinct from release.yml's own group.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Only superseded PR runs are cancelled; every commit on main gets a full run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: '1'

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Biome (repository config)
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Generated presets are up to date
        run: npm run check:index

  test:
    name: Test (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    # Windows is not part of the maintainers' local setup; report it without
    # blocking merges until it has proven stable.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        # Node 20 reached end-of-life in April 2026 and the dev toolchain
        # (vitest 5, semantic-release 25, commitlint 21) requires >= 22.12.
        # The published package itself ships only .grit files and runs on
        # whatever Node.js your Biome install uses.
        os: [ubuntu-latest]
        node: [22, 24, 26]
        experimental: [false]
        include:
          - os: macos-latest
            node: 24
            experimental: false
          - os: windows-latest
            node: 24
            experimental: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

  biome-compat:
    # The main `test` job runs on the exact Biome version pinned in
    # package.json (kept current by Dependabot); this job covers the floor.
    name: Biome minimum
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            .github/biome-minimum/package-lock.json

      - name: Install dependencies
        run: npm ci

      # A committed lockfile pins the minimum Biome version (and its native
      # binaries) by integrity hash. tests/biome-minimum.test.ts keeps it equal
      # to the peerDependencies floor.
      - name: Install the minimum supported Biome
        run: npm ci --prefix .github/biome-minimum --ignore-scripts --no-audit --no-fund

      - name: Test
        env:
          # Not BIOME_BINARY: Biome's own npm launcher reads that variable as the
          # path of the native executable and would re-spawn itself forever.
          BIOME_PLUGIN_TEST_BIN: ${{ github.workspace }}/.github/biome-minimum/node_modules/@biomejs/biome/bin/biome
        run: |
          echo "Testing against $(node "$BIOME_PLUGIN_TEST_BIN" --version)" | tee -a "$GITHUB_STEP_SUMMARY"
          npm test

  package:
    name: Package contents
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          # `npm pack` needs no dependencies: nothing to install or cache.
          package-manager-cache: false

      - name: Check tarball contents
        run: npm run pack:check -- --list
