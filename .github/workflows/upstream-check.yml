# Watches npm for new releases of @tanstack/eslint-plugin-query and opens an
# "upstream-sync" issue (deduplicated by title) describing new / removed /
# changed rules and preset changes. See scripts/check-upstream.js.
name: Upstream check

on:
  schedule:
    # Daily at 06:17 UTC (off the top of the hour to avoid scheduler congestion).
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only render the issue into the job summary; do not open it
        type: boolean
        default: false
      current:
        description: 'Testing aid: pretend this version is mirrored, e.g. 5.91.0 (forces a dry run)'
        type: string
        required: false
        default: ''

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check:
    name: Check @tanstack/eslint-plugin-query
    # Forks would otherwise run the cron and open issues on themselves.
    if: github.repository == 'LukastBorges/biome-plugin-tanstack-query'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # The script has zero dependencies: no install, nothing to cache.
          package-manager-cache: false

      - name: Check upstream release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Inputs are passed through the environment, never interpolated into the script.
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_CURRENT: ${{ inputs.current }}
        run: |
          args=()
          if [ "$INPUT_DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ -n "$INPUT_CURRENT" ]; then args+=(--current "$INPUT_CURRENT" --dry-run); fi
          node scripts/check-upstream.js "${args[@]}"
