# Pull-request hygiene, kept out of ci.yml on purpose: the title check must
# re-run when a PR title is *edited*, and an `edited` trigger in ci.yml would
# cancel (via its concurrency group) the full test run of the same PR.
name: Pull request

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  # Required checks must also report on merge-queue commits; the jobs below
  # are skipped there (a skipped job satisfies a required check).
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  title:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # PRs are squash-merged, so the title becomes the commit message that
      # semantic-release analyses. Same config as local `npx commitlint`.
      - name: Lint PR title
        env:
          # Passed through the environment, never interpolated into the script.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s\n' "$PR_TITLE" | npx --no-install commitlint --verbose; then
            {
              echo "### PR title is not a Conventional Commit"
              echo
              echo "Rename the pull request to e.g. \`feat(no-rest-destructuring): flag useQueries results\`."
              echo "Allowed types and scopes: see commitlint.config.js and CONTRIBUTING.md."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Every dependency is dev-only tooling (the published tarball has
          # none), so only known vulnerabilities are gated, not licenses.
          fail-on-severity: moderate
