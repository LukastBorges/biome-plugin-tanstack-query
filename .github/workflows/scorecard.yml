# OpenSSF Scorecard: supply-chain security posture (pinned actions, token
# permissions, branch protection, signed releases, ...). Results show up under
# Security > Code scanning and on https://scorecard.dev.
#
# Keep this file close to the upstream template: publishing results requires
# the job to be "unmodified" (no extra steps with write tokens, no env, no
# top-level write permissions).
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    # Weekly, Mondays 04:23 UTC.
    - cron: '23 4 * * 1'
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    if: github.repository == 'LukastBorges/biome-plugin-tanstack-query'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # upload SARIF to code scanning
      id-token: write # publish results to the public Scorecard API
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
