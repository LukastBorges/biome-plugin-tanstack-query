# Triaged advisories in development-only release tooling (read by OSV-Scanner
# and the OpenSSF Scorecard "Vulnerabilities" check).
#
# None of these packages ship to users: the published tarball contains only
# .grit files. They run only inside the release job on an ephemeral,
# single-tenant GitHub runner, on inputs from this repository.
#
# Each entry has no upstream fix today:
#   - braces@3.0.3 (via micromatch, semantic-release) is the latest release.
#   - the others are bundled inside the `npm` CLI package that
#     @semantic-release/npm depends on (bundled dependencies cannot be
#     overridden); npm 11.x and 12.2.0 still bundle the affected versions.
#
# `ignoreUntil` forces a re-review: when an entry expires, check `npm audit`
# and either bump the tooling or renew the entry with an updated reason.

# braces (micromatch): stack exhaustion on deeply nested brace patterns.
# Only matches the release config's own branch/asset globs.
[[IgnoredVulns]]
id = "GHSA-vfj7-8cjw-p6xm"
ignoreUntil = 2027-01-04
reason = "braces@3.0.3 has no fix; only expands this repository's own release globs (no attacker-controlled patterns)."

